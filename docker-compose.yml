version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: flicked_postgres
    restart: always
    environment:
      POSTGRES_USER: flicked_user
      POSTGRES_PASSWORD: flicked_password
      POSTGRES_DB: flicked_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flicked_user -d flicked_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flicked_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
